<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#05030b">
  <title>Un pequeño universo para ti 💛</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <div class="stars" aria-hidden="true"></div>
    <div class="nebula nebula-1" aria-hidden="true"></div>
    <div class="nebula nebula-2" aria-hidden="true"></div>

    <main class="intro" id="intro">
      <div class="intro-card">
        <div class="mini-flower">🌻</div>
        <p class="eyebrow">Tengo algo para ti</p>
        <h1>Haz clic<br>y mira lo que florece.</h1>
        <p class="intro-text">Un pequeño universo amarillo hecho especialmente para ti.</p>
        <button id="startButton" class="start-button">
          <span>Descubrir</span>
          <span class="button-heart">💛</span>
        </button>
        <p class="hint">Toca la pantalla para comenzar</p>
      </div>
    </main>

    <section class="universe" id="universe" aria-hidden="true">
      <div class="galaxy-core">
        <div class="core-glow"></div>
        <div class="core-flower">🌻</div>
      </div>

      <div class="orbit orbit-1"></div>
      <div class="orbit orbit-2"></div>
      <div class="orbit orbit-3"></div>

      <div id="flowers" class="flowers"></div>
      <div id="petals" class="petals"></div>
      <div id="messages" class="messages"></div>
      <div id="popups" class="popups"></div>
      <p class="tap-hint" id="tapHint">Toca las flores ✨</p>

      <div class="final-message" id="finalMessage">
        <p class="small-line">Y si alguna vez dudas...</p>
        <h2>recuerda que hay alguien<br>que piensa en ti con mucho cariño. 💛</h2>
        <p class="signature">— Para ti, con flores amarillas 🌻</p>
      </div>

      <button class="music-button" id="musicButton" aria-label="Pausar música">🔊</button>
      <button class="replay-button" id="replayButton">Volver a ver ✨</button>
    </section>

    <audio id="backgroundMusic" loop preload="auto">
      <source src="assets/audio/musica.mp3" type="audio/mpeg">
    </audio>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
